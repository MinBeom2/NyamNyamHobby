# 공통 설정. 비밀값은 환경변수(${...})로만 받고, 로컬에서는 BE/.env 를 읽는다.
server:
  forward-headers-strategy: framework # Nginx 리버스 프록시 헤더(X-Forwarded-Proto, X-Forwarded-Host, X-Forwarded-Port) 인식

spring:
  application:
    name: nyamnyam
  config:
    # BE/.env 가 있으면 읽음 (없어도 오류 없음). 서버에서는 실제 환경변수가 우선.
    import: optional:file:.env[.properties]
  profiles:
    # 프로필을 지정하지 않고 실행하면 local. 서버는 SPRING_PROFILES_ACTIVE=dev|prod 로 지정
    default: local

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nyamnyam}
    username: ${DB_USER:nyamnyam}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # 스키마는 Flyway가 관리. 엔티티와 다르면 기동 실패
    properties:
      hibernate:
        jdbc:
          time_zone: UTC # 명세서 규칙: 시간은 UTC 저장

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  rabbitmq:
    publisher-confirm-type: simple
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_APP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  servlet:
    multipart:
      max-file-size: 5MB # NFR-SEC-06: 프로필 2MB · 그 외 5MB (세부 제한은 업로드 API에서)
      max-request-size: 10MB

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
            scope:
              - email
              - profile

jwt:
  secret: ${JWT_SECRET:nyamnyam-secret-key-must-be-at-least-256-bits-long-for-hmac-sha256}
  access-token-validity-in-seconds: 1800 # 30분
  refresh-token-validity-in-seconds: 1209600 # 14일

exploration:
  session-size: ${EXPLORATION_SESSION_SIZE:12} # 새 탐색 세션의 최대 노출 수. 기존 세션은 생성 당시 값을 유지
  prefer-ratio: ${EXPLORATION_PREFER_RATIO:0.7}

recommendation:
  reason-outbox-enabled: ${RECOMMENDATION_REASON_OUTBOX_ENABLED:true}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  # 이미지 업로드(게시판 등): 서버 디스크에 저장하고 {public-base-url}/api/v1/uploads/images/... 로 내보낸다
  upload:
    dir: ${UPLOAD_DIR:./uploads}                                  # 서버는 /app/uploads(도커 볼륨)
    public-base-url: ${UPLOAD_PUBLIC_BASE_URL:http://localhost:8080} # 서버는 https://k15d104.p.ssafy.io
  youtube:
    api-key: ${YOUTUBE_API_KEY:}
  # 숏폼 수집(FR-SHORT-07): 취미별 키워드 검색 → 필터 → GPT 판별 → CANDIDATE 저장 → 목요일 주간 반영
  # 로컬·테스트에서 할당량을 쓰지 않도록 기본은 꺼 두고, 서버 .env에서 SHORT_COLLECT_ENABLED=true로 켠다.
  short-collect:
    enabled: ${SHORT_COLLECT_ENABLED:false}
    cron: "0 7 */6 * * *"        # 6시간마다 7분: 00:07·06:07·12:07·18:07 (Asia/Seoul)
    release-cron: "0 0 6 * * THU" # 매주 목 06:00 주간 반영
    keywords-per-run: 2           # 키워드당 101단위 → 하루 4회 × 2개 ≈ 800단위
    target-per-hobby: 40          # 취미별 CANDIDATE+ACTIVE 목표. 채우면 그 취미는 건너뜀
    max-per-channel: 3            # 한 취미에서 같은 채널 영상 최대 수
    min-view-count: 1000
    max-duration-seconds: 180
    daily-quota-limit: 9000       # YouTube 기본 한도 10,000 중 이 작업 상한
    confidence-threshold: 0.7     # "취미 영상"이라고 이 신뢰도 이상이면 CANDIDATE, 미만이면 NEEDS_REVIEW
    reject-threshold: 0.9         # "취미 영상 아님"이라고 이 신뢰도 이상일 때만 REJECTED, 미만이면 NEEDS_REVIEW
    classify-chunk-size: 20
    # 갱신: 목표(40개)를 채운 취미도 키워드마다 7일에 한 번, 최근 30일 업로드 중 검색 관련도 순 5개까지 새로 받음
    refresh-interval-days: 7
    refresh-window-days: 30
    refresh-max-per-keyword: 5
  # 정보 피드 수집(FR-FEED-02): 서울 행사·공연·전시를 받아 제목을 취미 행사 검색어(EVENT_KEYWORD)와 대조해 저장
  # 로컬·테스트에서 외부 API를 부르지 않도록 기본은 꺼 두고, 서버 .env에서 FEED_COLLECT_ENABLED=true로 켠다.
  feed-collect:
    enabled: ${FEED_COLLECT_ENABLED:false}
    cron: "0 0 5 * * *"   # 매일 05:00 (Asia/Seoul) 축제·공연·전시
    class-cron: "0 30 5 * * *" # 매일 05:30 공공 강좌(서울 공공서비스예약)
    tour-region-code: "11" # TourAPI 법정동 시도 코드(서울)
    kopis-region-code: "11"
    kopis-interval-millis: 500     # KOPIS 검색어 사이 쉬는 시간(연달아 부르면 웹서버가 400으로 막음)
    kopis-retry-delay-millis: 2000 # 실패 시 쉬고 한 번 다시 시도
    lookahead-days: 60     # KOPIS: 오늘부터 60일 안에 열리는 공연
    title-similarity: 0.8  # 출처가 다른 같은 행사 판단(시작일 같고 제목 유사도 이상)
    # 검색어에 안 걸린 강좌 중 소분류에 이 단어가 있으면 GMS에 보내지 않고 버림(토큰 절약)
    class-skip-categories: 역사, 진로, 자격, 정보통신, 어학, 과학
  # 정보 피드 GMS 취미 분류(FEED-B04): 후보 취미를 확인해 맞으면 그대로, 틀리면 다른 취미나 '그 외'로. 요약은 만들지 않음
  # 켜고 끄는 것은 feed-collect.enabled를 따름
  feed-classify:
    cron: "0 0 6 * * *"    # 매일 06:00 (수집이 끝난 뒤)
    daily-limit: 200       # 하루 최대 분류 건수(20건씩 GMS 10번, gpt-4o-mini로 약 35크레딧). 남은 건 다음 날
    chunk-size: 20
    model: gpt-4o-mini     # 30종 중 하나를 고르는 단순 판단이라 싼 모델 사용
    max-attempts: 3        # 답을 못 받은 횟수가 이만큼이면 후보(없으면 '그 외')로 확정
  # 장소 자동 수집(PLACE-B01): 서울 자치구 x 취미별 카카오 키워드로 검색하여 장소 저장
  # 로컬·테스트에서 외부 API를 부르지 않도록 기본은 꺼 두고, 서버 .env에서 PLACE_COLLECT_ENABLED=true로 켠다.
  place-collect:
    enabled: ${PLACE_COLLECT_ENABLED:false}
    cron: "0 0 3 * * SUN"  # 매주 일 03:00 (Asia/Seoul)
    max-pages: 2
    interval-millis: 200
    target-sido: "서울특별시"
  # 공공·문화 데이터 및 외부 로컬 인증키(공공데이터포털은 Decoding 키)
  public-data:
    tour-api:
      key: ${TOUR_API_KEY:}
    kopis:
      key: ${KOPIS_API_KEY:}
    culture-portal:
      key: ${CULTURE_PORTAL_API_KEY:}
    seoul-open-api:
      key: ${SEOUL_OPEN_API_KEY:}
    kakao-local:
      base-url: ${KAKAO_LOCAL_BASE_URL:https://dapi.kakao.com}
      key: ${KAKAO_LOCAL_API_KEY:${KAKAO_REST_API_KEY:}}
  # 레이트 리밋(Redis + Bucket4j 토큰 버킷). 정책별 한도는 global/ratelimit/RateLimitPolicy
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}   # 로컬 부하 테스트·시연 때 false로 끌 수 있다
    client-ip-header: X-Real-IP           # 서버 Nginx가 $remote_addr로 덮어쓰는 헤더

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      enabled: false # 메일 설정 전에도 health가 DOWN이 되지 않게

gms:
  base-url: ${GMS_BASE_URL:https://api.openai.com}
  api-key: ${GMS_API_KEY:}
  model: ${GMS_MODEL:gpt-4o}
