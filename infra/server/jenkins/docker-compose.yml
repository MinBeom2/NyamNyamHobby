# Jenkins (서버 위치: /home/ubuntu/jenkins, 같은 폴더 .env에 DOCKER_GID=서버 docker 그룹 번호)
# 접속: https://k15d104.p.ssafy.io/jenkins (Nginx가 127.0.0.1:19090으로 전달)

name: jenkins

services:
  jenkins:
    build: .
    image: nyam-jenkins
    container_name: jenkins
    restart: unless-stopped
    environment:
      JENKINS_OPTS: --prefix=/jenkins
      TZ: Asia/Seoul
      JAVA_OPTS: -Duser.timezone=Asia/Seoul
    ports:
      - "127.0.0.1:19090:8080"
    volumes:
      - jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      # 배포 설정(앱 compose·.env)을 Jenkins 안에서 같은 경로로 읽기 위함
      - /home/ubuntu/app:/home/ubuntu/app:ro
    group_add:
      - "${DOCKER_GID}"
    networks: [backend]

networks:
  backend:
    external: true

volumes:
  jenkins-home:
