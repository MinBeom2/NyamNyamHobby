# 백엔드 앱 (서버 위치: /home/ubuntu/app, 같은 폴더 .env 권한 600)
# Jenkins가 nyam-backend:latest 이미지를 빌드한 뒤 이 파일로 컨테이너를 교체한다
# 외부 접근은 Nginx의 /api 경로만 (127.0.0.1:18080)

name: nyam-app

services:
  backend:
    image: nyam-backend:latest
    container_name: backend
    restart: unless-stopped
    env_file: .env
    environment:
      # 명세서 규칙: DB에는 UTC로 저장. JVM 기본 시간대를 UTC로 두어 LocalDateTime.now()가 UTC가 되게 함
      # (주차·배치 시각처럼 한국 시간이 필요한 계산은 코드에서 Asia/Seoul을 명시)
      TZ: UTC
    ports:
      - "127.0.0.1:18080:8080"
    networks: [backend]

networks:
  backend:
    external: true
