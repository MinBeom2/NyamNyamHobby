# /etc/nginx/sites-available/default — 사이트 전체 설정 (certbot이 만든 기본 설정을 대체)
# 인증서 경로는 certbot이 발급한 그대로. 갱신(certbot renew)은 이 설정에서도 그대로 동작한다

server {
    listen 80;
    listen [::]:80;
    server_name k15d104.p.ssafy.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name k15d104.p.ssafy.io;

    ssl_certificate /etc/letsencrypt/live/k15d104.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/k15d104.p.ssafy.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    charset utf-8;

    # 백엔드·Jenkins·소셜 로그인
    include snippets/jenkins.conf;
    include snippets/api.conf;
    include snippets/oauth.conf;

    # 프론트엔드 (Jenkins가 /var/www/nyamnyam/releases/<빌드번호>에 배포하고 current 링크를 바꾼다)
    root /var/www/nyamnyam/current;
    index index.html;

    # index.html은 항상 새로 받게 해서 배포 직후 바로 새 버전이 보이게 함
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite 빌드 결과(파일명에 해시 포함)는 오래 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: 없는 경로는 index.html로 보내 화면에서 라우팅
    location / {
        try_files $uri $uri/ /index.html;
    }
}
